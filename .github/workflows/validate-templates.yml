name: Validate templates

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-templates-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.x"

      - name: Run validator tests
        run: python -m unittest discover -s .github/scripts -p 'test_*.py' -v

      - name: Validate and package templates
        run: python .github/scripts/validate_templates.py --output-dir dist

      - name: Upload template archives
        uses: actions/upload-artifact@v7
        with:
          name: template-archives
          path: dist/*
          if-no-files-found: error
          retention-days: 7

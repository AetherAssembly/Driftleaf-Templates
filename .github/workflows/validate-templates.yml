name: Validate templates

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-templates-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.x"

      - name: Validate and package templates
        run: |
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZIP_DEFLATED, ZipFile

          root = Path(".")
          template_dirs = sorted(
              path for path in root.iterdir()
              if path.is_dir() and not path.name.startswith(".")
          )
          if not template_dirs:
              raise SystemExit("No template directories found.")

          dist = root / "dist"
          dist.mkdir()

          for template_dir in template_dirs:
              files = sorted(
                  path for path in template_dir.rglob("*")
                  if path.is_file() and path.name != ".gitkeep"
              )
              markdown_files = [path for path in files if path.suffix.lower() == ".md"]
              if template_dir.name != "blank" and not markdown_files:
                  raise SystemExit(f"{template_dir}: no Markdown files found.")

              for path in markdown_files:
                  try:
                      content = path.read_text(encoding="utf-8")
                  except UnicodeDecodeError as error:
                      raise SystemExit(f"{path}: not valid UTF-8: {error}") from error
                  if not content.strip():
                      raise SystemExit(f"{path}: Markdown file is empty.")

              archive_path = dist / f"{template_dir.name}.zip"
              with ZipFile(archive_path, "w", compression=ZIP_DEFLATED) as archive:
                  for path in files:
                      archive.write(path, path.relative_to(template_dir))

              with ZipFile(archive_path) as archive:
                  if archive.testzip() is not None:
                      raise SystemExit(f"{archive_path}: ZIP archive failed integrity check.")
                  archived_markdown = [
                      name for name in archive.namelist()
                      if Path(name).suffix.lower() == ".md"
                  ]
                  if len(archived_markdown) != len(markdown_files):
                      raise SystemExit(f"{archive_path}: missing Markdown files.")

              print(f"Validated {template_dir.name}: {len(markdown_files)} Markdown file(s)")
          PY

      - name: Upload template archives
        uses: actions/upload-artifact@v7
        with:
          name: template-archives
          path: dist/*.zip
          if-no-files-found: error
          retention-days: 7

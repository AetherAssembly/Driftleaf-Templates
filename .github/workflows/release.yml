name: Publish template archives

on:
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      tag:
        description: >-
          Existing release tag to upload archives to (for example, v1).
          Dispatch from a branch containing the validator.
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: publish-template-archives-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out release tag
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name || github.ref }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.x"

      - name: Validate and package templates
        run: python .github/scripts/validate_templates.py --output-dir dist

      - name: Upload archives and checksums to the release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: gh release upload "$RELEASE_TAG" dist/* --clobber
